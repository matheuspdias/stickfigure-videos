name: Short nativo no YouTube

# Sobe o vertical nativo de uma release "tiktok-<slug>" como Short, publicado na hora (teste de 10/11/2026).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "slug do vídeo do TikTok (release tiktok-<slug>)"
        required: true
      titulo:
        description: "título (vazio = o do post.txt)"
        required: false

concurrency:
  group: short-nativo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: pip install -q google-api-python-client google-auth
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ inputs.titulo }}" ]; then
            python automacao/short_nativo.py "${{ inputs.slug }}" --titulo "${{ inputs.titulo }}"
          else
            python automacao/short_nativo.py "${{ inputs.slug }}"
          fi
      - name: Registrar
        if: always()
        run: |
          git config user.name "fazaconta-bot"
          git config user.email "fazaconta-bot@users.noreply.github.com"
          git add fila/shorts_nativos.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Short nativo publicado [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
